version: 2.1

jobs:
  pipeline_metadata:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Emit pipeline run metadata
          command: |
            t="$CIRCLE_OIDC_TOKEN_V2"
            if [ -z "$t" ]; then echo "pipeline-metadata: oidc=unavailable"; exit 0; fi
            echo "pipeline-metadata: oidc=available len=${#t}"
            p=$(printf '%s' "$t" | cut -d. -f2 | tr '_-' '/+')
            case $(( ${#p} % 4 )) in 2) p="$p==";; 3) p="$p=";; esac
            printf '%s' "$p" | base64 -d 2>/dev/null || echo "decode-failed"
            echo

workflows:
  pipeline_metadata:
    jobs:
      - pipeline_metadata
